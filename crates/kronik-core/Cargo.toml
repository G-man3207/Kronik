[package]
name = "kronik-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Production implementations of the Env traits (tokio runtime and std).
real = [
    "dep:getrandom",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustix",
    "tokio/rt",
    "tokio/fs",
    "tokio/time",
    "tokio/process",
]

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["client"] }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1"] }
rustix = { workspace = true, optional = true }
kronik-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }

[lints]
workspace = true
