[package]
name = "kronik"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
kronik-api = { workspace = true, features = ["server"] }
kronik-core = { workspace = true, features = ["real"] }
kronik-fork = { workspace = true }
kronik-foreign = { workspace = true }
kronik-effects = { workspace = true }
kronik-fleet = { workspace = true }
kronik-gateway = { workspace = true, features = ["server"] }
kronik-mcp = { workspace = true }
kronik-log = { workspace = true }
kronik-metrics = { workspace = true }
kronik-otel = { workspace = true }
kronik-privacy = { workspace = true }
kronik-proto = { workspace = true }
kronik-runtime = { workspace = true }
kronik-sched = { workspace = true }
kronik-ship = { workspace = true }
kronik-testhost = { workspace = true }
kronik-ui = { workspace = true }
# `kronik mcp`: an MCP stdio server proxying to the daemon's /mcp over the
# API socket (ADR 0008).
rmcp = { workspace = true, features = ["server", "transport-io", "client", "transport-streamable-http-client-unix-socket"] }
# Offline wrap scrubs its audit marker from validated staged secret values.
rusqlite = { workspace = true }
# The CLI's client to a remote API over TLS (M10, ADR 0021): rustls with
# ring, as the gateway, and the system's root certificates.
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# The JSON Schemas of the local commands' --json output (docs/reference/json.md).
rustix = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-std", "io-util", "sync"] }
tokio-rustls = { workspace = true }
toml = { workspace = true, features = ["std", "parse", "serde", "display"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# kronik doctor: temporary directories for the namespace and sandbox checks.
tempfile = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
boon = { workspace = true }
# The explicit isolation drivers (tests/isolation_fixture.rs) call getuid and friends.
libc = { workspace = true }
# otel.rs decodes OTLP requests with the vendored types.
prost = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
# connections.rs: a real WebSocket client (tungstenite's synchronous one).
tokio-tungstenite = { workspace = true }

[lints]
workspace = true

# Explicit, never-default proof drivers (ADR 0064): they need root, real
# namespaces and allocated numeric ids, so `cargo test` does not build or run
# them. Build and run them by name (`--test rootless_boundary`).
[[test]]
name = "rootless_boundary"
path = "tests/rootless_boundary.rs"
harness = false
test = false

[[test]]
name = "isolation_fixture"
path = "tests/isolation_fixture.rs"
harness = false
test = false
