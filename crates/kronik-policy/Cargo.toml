[package]
name = "kronik-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Without `chrono` there are no timestamp or duration types, so nothing in a
# rule can reach a clock; `regex` provides `matches()` (ADR 0007).
cel = { workspace = true, features = ["regex"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, features = ["std", "parse", "serde"] }

[lints]
workspace = true
