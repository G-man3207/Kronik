[package]
name = "kronik-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
kronik-core = { workspace = true }
kronik-effects = { workspace = true }
kronik-log = { workspace = true }
kronik-metrics = { workspace = true }
kronik-privacy = { workspace = true }
kronik-proto = { workspace = true }
kronik-runtime = { workspace = true }
kronik-sched = { workspace = true }
kronik-ship = { workspace = true }
prost = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
