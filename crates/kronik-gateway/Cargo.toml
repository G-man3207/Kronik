[package]
name = "kronik-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The hyper TCP server (production), with TLS from files or ACME; the
# service function needs only Env.
server = [
    "dep:bytes", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/net", "tokio/rt", "tokio/time",
    "dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:instant-acme", "dep:rcgen",
    "dep:x509-parser",
]

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
instant-acme = { workspace = true, optional = true }
kronik-core = { workspace = true }
kronik-metrics = { workspace = true }
kronik-privacy = { workspace = true }
kronik-proto = { workspace = true }
kronik-sched = { workspace = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-rustls = { workspace = true, optional = true }
tracing = { workspace = true }
x509-parser = { workspace = true, optional = true }

[dev-dependencies]
kronik-core = { workspace = true, features = ["real"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
