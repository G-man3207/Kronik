[package]
name = "spike-c-gvisor"
version = "0.0.0"
edition = "2024"
publish = false
description = "Kronik M0 spike C: OCI bundles, runsc on a host without KVM, and bridges into the sandbox"
license = "Elastic-2.0"

# Standalone project: the root workspace excludes spikes/.
[workspace]

# echo-server, uds-shim, netprobe and bridge-bench use only std, so they run
# in a scratch image when built for x86_64-unknown-linux-musl.
[dependencies]
# oci-tool only: layer tarballs, gzip layers, digest checks, image JSON.
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.11.1"
serde_json = "1.0.154"

[profile.release]
debug = "line-tables-only"
