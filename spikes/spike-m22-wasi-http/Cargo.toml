[package]
name = "spike-m22-wasi-http"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone, like the other spikes (not a workspace member).
[workspace]

[dependencies]
kronik-core = { path = "../../crates/kronik-core" }
kronik-proto = { path = "../../crates/kronik-proto" }
kronik-runtime = { path = "../../crates/kronik-runtime" }
wasmtime = { version = "=50.0.0", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "pooling-allocator", "parallel-compilation", "std"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "=50.0.0", default-features = false, features = ["std"] }
# ADR 0070 §1: no default-send-request (no network stack), no p3.
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p2"] }
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
