# The Kronik book: `scripts/ci.sh book` builds it with the pinned mdBook
# (scripts/install-mdbook.sh) into target/book and checks its links.
# docs/ itself is the source, so existing paths such as docs/errors.md stay
# where they are; docs/SUMMARY.md lists the chapters.

[book]
title = "Kronik"
description = "Kronik: a runtime where a system is a deterministic function of its history."
language = "en"
src = "."

[build]
build-dir = "../target/book"
create-missing = false

# Full-text search covers the guides, concepts and references. The design
# notes and ADRs are long contributor rationale, reached from the table of
# contents; indexing them pushed the search index past mdBook's 10 MB warning
# (a page that opens search downloads the whole index).
[output.html.search.chapter]
"design" = { enable = false }
"adr" = { enable = false }
