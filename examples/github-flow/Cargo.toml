[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kronik-sdk = { path = "vendor/kronik-sdk" }
serde_json = "1"

# The project is a workspace of its own; the vendored SDK is a member.
[workspace]

# Small components: every byte is compiled and stored per code hash.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"
