name: Release

# Manual exact-tag releases only. Two independent compiled builds must match
# before GitHub OIDC/Sigstore attests the licensed archives and release metadata.
# Draft publication remains an explicit owner decision; no push/tag trigger.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Where the release's files will be served; install.sh downloads from there"
        required: true
        type: string
      draft:
        description: "Create a draft GitHub release with the files"
        required: false
        type: boolean
        default: false
      keyhelper:
        description: "Also build the separate optional x86_64 GNU PKCS#11 helper"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build the release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml; release.sh adds
      # the musl targets and its pinned tools (zig, cargo-zigbuild,
      # cargo-cyclonedx).
      - name: Install Rust
        run: rustup toolchain install

      - name: Require the exact source tag and repository
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$REPOSITORY_ID" = 1432583300
          version=$(cargo metadata --locked --format-version 1 --no-deps |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kronik"))')
          test "$SOURCE_REF" = "refs/tags/v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$SOURCE_SHA^{commit}")"

      - name: Reproduce the actual compiled release
        env:
          KRONIK_BASE_URL: ${{ inputs.base_url }}
          KRONIK_RELEASE_KEYHELPER: ${{ inputs.keyhelper && 'yes' || 'no' }}
        run: python3 scripts/reproduce-release.py

      - name: Check the x86_64 archive
        run: |
          mkdir -p "$RUNNER_TEMP/kronik-release"
          tar -xzf dist/release/kronik-x86_64-unknown-linux-musl.tar.gz \
            -C "$RUNNER_TEMP/kronik-release" kronik LICENSE NOTICE THIRD_PARTY_LICENSES.txt kronik.cdx.json
          "$RUNNER_TEMP/kronik-release/kronik" --version

      - name: Attest the archives and release metadata
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/kronik-*.tar.gz
            dist/release/install.sh
            dist/release/reproducibility.json
            dist/release/SHA256SUMS
          create-storage-record: false

      - name: Retain the standard attestation bundle beside each archive
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for archive in dist/release/kronik-*.tar.gz; do
            cp "$BUNDLE_PATH" "$archive.sigstore.json"
          done

      - name: Verify and install the actual attested x86_64 archives
        env:
          KRONIK_INSTALL_KEYHELPER: ${{ inputs.keyhelper && 'yes' || 'no' }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -q -fsSL "file://$PWD/dist/release/install.sh" |
            KRONIK_BASE_URL="file://$PWD/dist/release" \
              KRONIK_INSTALL_DIR="$RUNNER_TEMP/kronik-verified-standalone" \
              KRONIK_INSTALL_RUNSC=no sh
          if [ "$KRONIK_INSTALL_KEYHELPER" = yes ]; then
            tar -xzOf dist/release/kronik-keyhelper-x86_64-unknown-linux-gnu.tar.gz kronik-keyhelper |
              cmp - "$RUNNER_TEMP/kronik-verified-standalone/kronik-keyhelper"
          fi
          INPUT_COMMAND=install INPUT_VERSION="$version" \
            INPUT_BASE_URL="file://$PWD/dist/release" \
            RUNNER_TEMP="$RUNNER_TEMP/kronik-verified-action" \
            python3 action/kronik_action.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kronik-release
          path: dist/release/
          if-no-files-found: error

      - name: Draft release
        if: inputs.draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$("$RUNNER_TEMP/kronik-release/kronik" --version | head -n 1 | cut -d ' ' -f 2)"
          gh release create "v$version" --draft --target "$GITHUB_SHA" \
            --title "kronik $version" \
            --notes "Reproduced static musl daemon archives and, when selected, the separate optional x86_64 GNU PKCS#11 helper; GitHub OIDC/Sigstore attestations, original notices, per-artifact CycloneDX SBOMs and actual two-build evidence." \
            dist/release/*
