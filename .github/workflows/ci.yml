name: CI

# Manual only. A push or a pull request does not start this workflow, so a
# hosted run spends minutes only when someone asks for it. Start it from the
# Actions tab, or with `gh workflow run ci.yml`. The same steps run locally
# with scripts/ci.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo made `cargo test --workspace` 17 GB, more than the runner's
  # disk; line tables keep file:line in panics at 7.4 GB.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ci:
    name: fmt, clippy, hygiene, test, docs, book, examples, ts, sdks, dst, deny, foreign, identity, action
    runs-on: ubuntu-24.04
    steps:
      # The runner's preinstalled SDKs that this job does not use, for disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history and tags: the ts step compares every released
          # contract snapshot with its source at the release's producer
          # revision (scripts/verify-compatibility.py), which a shallow
          # checkout does not have, so the comparison would be skipped.
          fetch-depth: 0

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            examples -> target

      # Node.js for the TypeScript SDK and examples (the ts step); the pinned
      # toolchain's packages need Node.js 22.20 or later, as kronik build checks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/ts/package-lock.json
            examples/package-lock.json

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2

      # Each step runs the same command as scripts/ci.sh does locally.
      - name: fmt
        run: scripts/ci.sh fmt
      - name: clippy
        run: scripts/ci.sh clippy
      - name: hygiene
        run: scripts/ci.sh hygiene

      # The CLI audit and API mutation tests run the repository's owned
      # TLS/code/PKCE/JWT provider through a pinned private Python runtime
      # (CONTRIBUTING.md); the test step is its only consumer.
      - name: Prepare the pinned OIDC test runtime
        run: |
          python3 -m venv target/oidc-test-python
          target/oidc-test-python/bin/python3 -m pip install --only-binary=:all: \
            -r scripts/requirements-oidc-tests.txt

      - name: test
        env:
          KRONIK_TEST_PYTHON: ${{ github.workspace }}/target/oidc-test-python/bin/python3
        run: scripts/ci.sh test
      - name: docs
        run: scripts/ci.sh docs
      - name: book
        run: scripts/ci.sh book
      - name: examples
        run: scripts/ci.sh examples
      - name: ts
        run: scripts/ci.sh ts
      # The Python and Go SDKs: installs their pinned toolchains, builds and
      # tests the examples the identity step replays.
      - name: sdks
        run: scripts/ci.sh sdks
      - name: dst
        run: scripts/ci.sh dst
      - name: deny
        run: scripts/ci.sh deny
      # Trusted checkout setup only: never manufacture an unsigned release to
      # bypass the production installer's attestation policy.
      - name: Install gVisor
        run: |
          target/debug/kronik --version
          sudo KRONIK_INSTALL_RUNSC=yes sh scripts/install-runsc.sh </dev/null
          runsc --version
      # The foreign step needs root: it runs as root with this user's
      # toolchain, then gives the build files back for the later steps and the
      # cache. KRONIK_FOREIGN_TESTS=require makes any skip a failure.
      - name: foreign
        run: |
          status=0
          sudo -E env "PATH=$PATH" "HOME=$HOME" KRONIK_FOREIGN_TESTS=require \
            scripts/ci.sh foreign || status=$?
          sudo chown -R "$(id -u):$(id -g)" target examples "$HOME/.cargo" "$HOME/.rustup"
          exit "$status"
      - name: identity
        run: scripts/ci.sh identity
      - name: action
        run: scripts/ci.sh action
