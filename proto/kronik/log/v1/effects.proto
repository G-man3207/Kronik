// Kronik log format v1: the plaintext inside EffectRecord.request and
// EffectRecord.response (each a Sealable holding one of these, encoded).
// Secret values never appear here: a secret is a name, a version and a
// keyed version hash. See common.proto for the format rules.
syntax = "proto3";

package kronik.log.v1;

import "kronik/log/v1/common.proto";

// A secret used by an effect: never the value.
message SecretRef {
  string name = 1;
  // Header template such as "Bearer {}"; empty for crypto and reveal.
  string template = 2;
  // Legacy identity: unchanged uint32 field and four-byte hash input.
  uint32 version = 3;
  // 16 bytes; legacy v1 hash through u32::MAX, explicit v2 hash for wide_version.
  bytes version_hash = 4;
  // Exactly one version field is set. Wide values are >u32::MAX and <=2^53-1.
  uint64 wide_version = 5;
}

message HttpEffectHeader {
  string name = 1;
  oneof value {
    string text = 2;
    SecretRef secret = 3;
  }
}

// http.fetch request.
message HttpEffectRequest {
  string method = 1;
  string url = 2;
  repeated HttpEffectHeader headers = 3;
  bytes body = 4;
  // 0: exact legacy v1 normalization; 2: strict typed-component redaction;
  // 3: version 2 less the names in fields 6 and 7, which it also hashes
  // (ADR 0134). New requests use 3 when the actor type has fingerprint rules
  // and 2 otherwise. Other versions are invalid.
  uint32 fingerprint_version = 5;
  // Version 3 only: the header names (lowercase) and query-parameter names
  // the actor type's rules left out of the fingerprint besides the six
  // default headers, sorted and without duplicates.
  repeated string fingerprint_excluded_headers = 6;
  repeated string fingerprint_excluded_query = 7;
}

message HeaderPair {
  string name = 1;
  string value = 2;
}

// http.fetch response (after secret scrubbing).
message HttpEffectResponse {
  uint32 status = 1;
  repeated HeaderPair headers = 2;
  bytes body = 3;
}

// actor.call request.
message CallEffectRequest {
  ActorRef to = 1;
  Message msg = 2;
  // Unset when the call has no compensation.
  Message compensate = 3;
  string message_id = 4;
  // 0 verifies the exact historical fingerprint; new host requests use 2.
  uint32 fingerprint_version = 5;
}

// actor.call response: the callee's reply, unset for output::none.
message CallEffectResponse {
  Message reply = 1;
  // The callee's turn ("<branch>:<lsn>"), for orphans and history.
  string turn_id = 2;
}

// crypto.hmac-sha256 and crypto.sign-ed25519; the response is the result.
message CryptoEffectRequest {
  string algorithm = 1;
  SecretRef secret = 2;
  // blake3 of the data.
  bytes data_hash = 3;
}

// secret.reveal: no response payload, the value is never recorded.
message RevealEffectRequest {
  SecretRef secret = 1;
}

// connection.send-now request (M24). There is no response payload: the
// status is the result.
message ConnectionSendRequest {
  string connection = 1;
  // The frame's outgoing seq; 0 unless the status is OK.
  uint64 seq = 2;
  Frame.Kind kind = 3;
  bytes data = 4;
  string event = 5;
  string id = 6;
}
