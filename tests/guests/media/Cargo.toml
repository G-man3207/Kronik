[package]
name = "kronik-test-media"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test guest (kind `media`) that reads, writes and returns blobs, for the M25/M26 tests and the simulator"
license = "Elastic-2.0"

# Standalone project built for wasm32-wasip2; not part of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.63.0"

[features]
# Another `write` pattern (tests/guests/media-alt.wasm): code that writes
# other blobs for the same input, as a rolled-back version would.
alternate = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"
